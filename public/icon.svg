<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.85" />
    </radialGradient>
    <radialGradient id="handleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.85" />
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark OLED Background Squircle -->
  <rect width="128" height="128" rx="28" fill="#101014" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- 8x8 Inactive Base Dots -->
  <!-- Col coordinates: 19, 32, 45, 58, 71, 84, 97, 110 -->
  <!-- Row 0 (Y=19) -->
  <circle cx="19" cy="19" r="3" fill="#1c1c22" />
  <circle cx="32" cy="19" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens top -->
  <circle cx="45" cy="19" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens top -->
  <circle cx="58" cy="19" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens top -->
  <circle cx="71" cy="19" r="3" fill="#1c1c22" />
  <circle cx="84" cy="19" r="3" fill="#1c1c22" />
  <circle cx="97" cy="19" r="3" fill="#1c1c22" />
  <circle cx="110" cy="19" r="3" fill="#1c1c22" />

  <!-- Row 1 (Y=32) -->
  <circle cx="19" cy="32" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens left -->
  <circle cx="32" cy="32" r="3" fill="#1c1c22" />
  <circle cx="45" cy="32" r="4.5" fill="#ffffff" filter="url(#softGlow)" /> <!-- Reflection spark! -->
  <circle cx="58" cy="32" r="3" fill="#1c1c22" />
  <circle cx="71" cy="32" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens right -->
  <circle cx="84" cy="32" r="3" fill="#1c1c22" />
  <circle cx="97" cy="32" r="3" fill="#1c1c22" />
  <circle cx="110" cy="32" r="3" fill="#1c1c22" />

  <!-- Row 2 (Y=45) -->
  <circle cx="19" cy="45" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens left -->
  <circle cx="32" cy="45" r="3" fill="#1c1c22" />
  <circle cx="45" cy="45" r="3" fill="#1c1c22" />
  <circle cx="58" cy="45" r="3" fill="#1c1c22" />
  <circle cx="71" cy="45" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens right -->
  <circle cx="84" cy="45" r="3" fill="#1c1c22" />
  <circle cx="97" cy="45" r="3" fill="#1c1c22" />
  <circle cx="110" cy="45" r="3" fill="#1c1c22" />

  <!-- Row 3 (Y=58) -->
  <circle cx="19" cy="58" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens left -->
  <circle cx="32" cy="58" r="3" fill="#1c1c22" />
  <circle cx="45" cy="58" r="3" fill="#1c1c22" />
  <circle cx="58" cy="58" r="3" fill="#1c1c22" />
  <circle cx="71" cy="58" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens right -->
  <circle cx="84" cy="58" r="3" fill="#1c1c22" />
  <circle cx="97" cy="58" r="3" fill="#1c1c22" />
  <circle cx="110" cy="58" r="3" fill="#1c1c22" />

  <!-- Row 4 (Y=71) -->
  <circle cx="19" cy="71" r="3" fill="#1c1c22" />
  <circle cx="32" cy="71" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens bottom -->
  <circle cx="45" cy="71" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens bottom -->
  <circle cx="58" cy="71" r="4.3" fill="url(#lensGlow)" filter="url(#softGlow)" /> <!-- Lens bottom -->
  <circle cx="71" cy="71" r="4.5" fill="url(#handleGlow)" filter="url(#softGlow)" /> <!-- Joint -->
  <circle cx="84" cy="71" r="3" fill="#1c1c22" />
  <circle cx="97" cy="71" r="3" fill="#1c1c22" />
  <circle cx="110" cy="71" r="3" fill="#1c1c22" />

  <!-- Row 5 (Y=84) -->
  <circle cx="19" cy="84" r="3" fill="#1c1c22" />
  <circle cx="32" cy="84" r="3" fill="#1c1c22" />
  <circle cx="45" cy="84" r="3" fill="#1c1c22" />
  <circle cx="58" cy="84" r="3" fill="#1c1c22" />
  <circle cx="71" cy="84" r="3" fill="#1c1c22" />
  <circle cx="84" cy="84" r="4.5" fill="url(#handleGlow)" filter="url(#softGlow)" /> <!-- Handle 1 -->
  <circle cx="97" cy="84" r="3" fill="#1c1c22" />
  <circle cx="110" cy="84" r="3" fill="#1c1c22" />

  <!-- Row 6 (Y=97) -->
  <circle cx="19" cy="97" r="3" fill="#1c1c22" />
  <circle cx="32" cy="97" r="3" fill="#1c1c22" />
  <circle cx="45" cy="97" r="3" fill="#1c1c22" />
  <circle cx="58" cy="97" r="3" fill="#1c1c22" />
  <circle cx="71" cy="97" r="3" fill="#1c1c22" />
  <circle cx="84" cy="97" r="3" fill="#1c1c22" />
  <circle cx="97" cy="97" r="4.5" fill="url(#handleGlow)" filter="url(#softGlow)" /> <!-- Handle 2 -->
  <circle cx="110" cy="97" r="3" fill="#1c1c22" />

  <!-- Row 7 (Y=110) -->
  <circle cx="19" cy="110" r="3" fill="#1c1c22" />
  <circle cx="32" cy="110" r="3" fill="#1c1c22" />
  <circle cx="45" cy="110" r="3" fill="#1c1c22" />
  <circle cx="58" cy="110" r="3" fill="#1c1c22" />
  <circle cx="71" cy="110" r="3" fill="#1c1c22" />
  <circle cx="84" cy="110" r="3" fill="#1c1c22" />
  <circle cx="97" cy="110" r="3" fill="#1c1c22" />
  <circle cx="110" cy="110" r="4.5" fill="#38bdf8" filter="url(#softGlow)" /> <!-- Handle Tip Neon Cyan -->
</svg>
